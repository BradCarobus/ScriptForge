<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScriptForge — YouTube HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Lock screen -->
<div id="lock" class="lock">
  <form id="lockForm" class="lock-card" autocomplete="off">
    <div class="logo">ScriptForge</div>
    <p class="muted">YouTube HQ — enter password</p>
    <input id="lockInput" type="password" placeholder="Password" autofocus>
    <label class="check-inline"><input id="lockRemember" type="checkbox" checked> Remember this device</label>
    <button class="btn primary" type="submit">Unlock</button>
    <p id="lockError" class="error hidden">Nope. Try again.</p>
  </form>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">
      <span class="logo">ScriptForge</span>
      <span class="logo-sub">YouTube HQ</span>
    </div>
    <nav id="nav" class="nav">
      <button data-view="hub">Hub</button>
      <button data-view="bank">Idea Bank <span class="badge" data-count="bank"></span></button>
      <button data-view="vet">Vetting <span class="badge" data-count="vet"></span></button>
      <button data-view="skeleton">Skeletons <span class="badge" data-count="skeleton"></span></button>
      <button data-view="production">Production <span class="badge" data-count="production"></span></button>
      <button data-view="playbook">Playbook</button>
      <button data-view="settings" title="Settings">⚙</button>
    </nav>
    <div class="sync" id="sync" title="Where your data is saved"></div>
  </header>

  <main id="main"></main>
</div>

<div id="toast" class="toast"></div>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
